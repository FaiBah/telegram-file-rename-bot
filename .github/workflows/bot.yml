name: Maxico Rename Bot

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest

    env:
      API_PORT: 8081

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore API cache
        id: cache
        uses: actions/cache@v4
        with:
          path: api
          key: telegram-bot-api-ubuntu-v1

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            g++ \
            make \
            cmake \
            gperf \
            zlib1g-dev \
            libssl-dev

      - name: Build Local Bot API
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive \
            https://github.com/tdlib/telegram-bot-api.git

          cd telegram-bot-api
          mkdir build
          cd build

          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/api" \
            ..

          cmake --build . \
            --target install \
            --parallel 2

      - name: Start Local Bot API
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          api/bin/telegram-bot-api \
            --api-id="$API_ID" \
            --api-hash="$API_HASH" \
            --local \
            --http-port="$API_PORT" \
            > api.log 2>&1 &

          echo $! > api.pid

          echo "Waiting for API..."

          for i in {1..30}; do
            if curl -s \
              "http://127.0.0.1:$API_PORT/" \
              >/dev/null 2>&1; then
              echo "API ready"
              break
            fi

            sleep 2
          done

          cat api.log || true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python bot.py

      - name: Cleanup
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" 2>/dev/null || true
          fi

          rm -rf downloads