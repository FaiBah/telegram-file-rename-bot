name: Telegram File Rename Bot

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest

    env:
      API_PORT: 8081
      API_REPO: FaiBah/telegram-bot-api-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Local Bot API
        run: |
          set -e

          mkdir -p api

          VERSION=$(curl -fsSL \
            "https://api.github.com/repos/$API_REPO/releases/latest" \
            | python -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")

          ASSET="telegram-bot-api-linux-x64-${VERSION}.tar.gz"

          curl -fL \
            -o telegram-bot-api.tar.gz \
            "https://github.com/$API_REPO/releases/download/${VERSION}/${ASSET}"

          tar -xzf telegram-bot-api.tar.gz -C api
          chmod +x api/bin/telegram-bot-api

      - name: Start Local Bot API
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -e

          api/bin/telegram-bot-api \
            --api-id="$API_ID" \
            --api-hash="$API_HASH" \
            --local \
            --http-port="$API_PORT" \
            > api.log 2>&1 &

          echo $! > api.pid

          echo "Waiting for Local Bot API..."

          for i in {1..60}; do
            if curl -fsS \
              "http://127.0.0.1:$API_PORT/" \
              >/dev/null 2>&1; then
              echo "Local Bot API ready."
              break
            fi

            if [ "$i" = "60" ]; then
              echo "Local Bot API failed to start."
              cat api.log
              exit 1
            fi

            sleep 2
          done

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py

      - name: Cleanup
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" 2>/dev/null || true
          fi

          rm -rf downloads
          rm -f telegram-bot-api.tar.gz
